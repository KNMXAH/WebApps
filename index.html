<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개웅중학교 과학 웹앱 대시보드</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .dashboard-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 250px;
            text-align: center;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .card a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .card a:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>개웅중학교 과학 웹앱 대시보드</h1>

    <div class="dashboard-container">
        <!-- 첫 번째 웹앱 카드 -->
        <div class="card">
            <h3>원소 퀴즈</h3>
            <p>과학2 - 물질의 구성</p>
            <p>원소 퀴즈 점수로 경쟁하자</p>
            <a href="./ElementsQuiz/">앱 실행하기</a>
        </div>

        <!-- 두 번째 웹앱 카드 -->
        <div class="card">
            <h3>원자모형 AR</h3>
            <p>과학2 - 물질의 구성</p>
            <p>원자 모형을 AR로 관찰하자</p>
            <a href="./AtomAR/">앱 실행하기</a>
        </div>

        <!-- 세 번째 웹앱 카드 -->
        <div class="card">
            <h3>운동 분석(개발중)</h3>
            <p>과학3 - 역학적 에너지의 보존</p>
            <p>공이 자유낙하, 혹은 위로 던져진 영상을 촬영하고 분석해보자</p>
            <a href="./MotionAnalyzer/">앱 실행하기</a>
        </div>
    </div>

</body>
</html>
