<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중학생을 위한 운동 분석 프로그램</title>
    <link rel="stylesheet" href="style.css">
    <!-- FFmpeg v0.11.6 및 mp4box.js CDN 로드 -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mp4box.js/0.5.2/mp4box.all.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 상단 가이드 텍스트 박스 -->
        <header class="guide-box" id="guideBox">
            <h2>안내</h2>
            <p id="guideText">1단계: 분석을 원하는 영상을 업로드해주세요.</p>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <div class="main-content">
            <!-- 좌측: 비디오/캔버스 및 컨트롤러 영역 -->
            <div class="left-panel">
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="videoCanvas"></canvas>
                </div>
                
                <!-- 단계별 컨트롤 패널 -->
                <div class="controls-panel">
                    <!-- 단계 1: 업로드 -->
                    <div class="step-section" id="step1Section">
                        <label class="file-upload-btn">
                            📁 영상 업로드 (MOV, MP4, WEBM 등)
                            <input type="file" id="videoInput" accept="video/*" style="display: none;">
                        </label>
                        <div id="loadingStatus" class="status-text"></div>
                    </div>

                    <!-- 단계 2: FPS 입력 -->
                    <div class="step-section hidden" id="step2Section">
                        <label>영상의 FPS (초당 프레임 수): <input type="number" id="fpsInput" value="30" min="1" max="240"></label>
                        <button id="setFpsBtn" class="primary-btn">FPS 설정 완료</button>
                    </div>

                    <!-- 단계 3: 기준자 설정 -->
                    <div class="step-section hidden" id="step3Section">
                        <button id="rulerModeBtn" class="primary-btn">기준자 설정 (화면 클릭)</button>
                        <div id="rulerInfo" class="status-text">기준자 양 끝을 클릭하고 실제 길이를 입력하세요.</div>
                        <div id="rulerInputContainer" class="hidden">
                            <label>실제 길이 (m): <input type="number" id="rulerRealLength" value="1.0" step="0.01"></label>
                            <button id="confirmRulerBtn" class="primary-btn">기준자 확정</button>
                        </div>
                    </div>

                    <!-- 단계 4: 분석 구간 설정 -->
                    <div class="step-section hidden" id="step4Section">
                        <h3>분석 구간 설정</h3>
                        <div class="slider-group">
                            <label>분석 시작 프레임: <span id="startFrameVal">0</span></label>
                            <input type="range" id="startFrameSlider" min="0" max="100" value="0">
                        </div>
                        <div class="slider-group">
                            <label>분석 종료 프레임: <span id="endFrameVal">100</span></label>
                            <input type="range" id="endFrameSlider" min="0" max="100" value="100">
                        </div>
                        <button id="confirmRangeBtn" class="primary-btn">구간 확정 및 공 위치 설정</button>
                    </div>

                    <!-- 단계 5 & 6: 공 초기 위치 및 추적 -->
                    <div class="step-section hidden" id="step5Section">
                        <p>캔버스 위의 <b>공의 중심점</b>을 클릭한 후, 나타나는 직사각형(ROI)의 크기를 조절하거나 드래그하세요.</p>
                        <button id="startTrackingBtn" class="primary-btn">🚀 추적 시작</button>
                    </div>

                    <!-- 단계 9: 분석 화면 컨트롤러 -->
                    <div class="step-section hidden" id="step9Section">
                        <h3>역학적 에너지 분석 구간</h3>
                        <div class="slider-group">
                            <label>현재 프레임: <span id="analysisCurrentFrameVal">0</span></label>
                            <input type="range" id="analysisFrameSlider" min="0" max="100" value="0">
                        </div>
                        <button id="downloadCsvBtn" class="success-btn">📥 CSV 데이터 받기</button>
                    </div>
                </div>
            </div>

            <!-- 우측: 데이터 표 또는 에너지 분석 그래프 영역 -->
            <div class="right-panel">
                <!-- 단계 7, 8: 추적 데이터 표 -->
                <div id="tableSection" class="panel-view">
                    <h3>수집된 공의 위치 데이터</h3>
                    <div class="table-container">
                        <table id="dataTable">
                            <thead>
                                <tr>
                                    <th>프레임</th>
                                    <th>시간 (s)</th>
                                    <th>X (px)</th>
                                    <th>Y (px)</th>
                                    <th>실제 X (m)</th>
                                    <th>실제 Y (m)</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 데이터 동적 생성 -->
                            </tbody>
                        </table>
                    </div>
                    <button id="goToEnergyAnalysisBtn" class="primary-btn hidden">에너지 분석 시작 ➔</button>
                </div>

                <!-- 단계 10: 에너지 분석 대시보드 -->
                <div id="energySection" class="panel-view hidden">
                    <h3>에너지 분석 대시보드</h3>
                    <div class="options-group">
                        <div class="option-row">
                            <span>에너지 종류:</span>
                            <label><input type="radio" name="energyType" value="potential" checked> 위치 에너지</label>
                            <label><input type="radio" name="energyType" value="kinetic"> 운동 에너지</label>
                            <label><input type="radio" name="energyType" value="total"> 운동 + 위치 에너지</label>
                        </div>
                        <div class="option-row">
                            <span>모드:</span>
                            <label><input type="radio" name="calcMode" value="theory" checked> 이론 (2차함수 적합)</label>
                            <label><input type="radio" name="calcMode" value="reality"> 현실 (실측 데이터)</label>
                        </div>
                    </div>
                    
                    <!-- 에너지 시각화 그래프 박스 -->
                    <div id="energyGraphContainer" class="energy-graph-container">
                        <!-- 동적 막대그래프 렌더링 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
