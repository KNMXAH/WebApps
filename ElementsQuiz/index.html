    <style>
        /* 1. 화면 전체 흔들림 애니메이션 */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .pow-mode-shake {
            animation: shake 0.4s;
        }
        
        .shake-effect {
            animation: shake 0.3s ease-in-out;
        }

        /* 2. 팡팡 터지는 파티클(입자) 스타일 */
        .particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            z-index: 50;
            opacity: 0;
        }
        @keyframes pop {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }
        @keyframes microShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-1px, 1px); }
            75% { transform: translate(1px, -1px); }
        }
        .micro-shake {
            animation: microShake 0.15s ease-in-out;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

        // 🔥 본인의 Firebase 설정값으로 변경하세요
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyDK60Ru0OMo-CphHvsWIAp982arivZiS0Y",
            authDomain: "element-symbols-quiz.firebaseapp.com",
            projectId: "element-symbols-quiz",
            storageBucket: "element-symbols-quiz.firebasestorage.app",
            messagingSenderId: "603609710793",
            appId: "1:603609710793:web:02e5934ad24cf9d6144d18",
            measurementId: "G-0Q17X426QX"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        const DOMAIN = "@element.quiz"; // 아이디 로그인을 위한 내부 가상 도메인
        // 원소 데이터베이스 예시 (원하시는 만큼 추가/수정 가능)
        const elementData = [
            { number: 1, symbol: "H", name: "수소" , count: 1 },
            { number: 2, symbol: "He", name: "헬륨" , count: 1 },
            { number: 3, symbol: "Li", name: "리튬" , count: 1 },
            { number: 4, symbol: "Be", name: "베릴륨" , count: 1 },
            { number: 5, symbol: "B", name: "붕소" , count: 1 },
            { number: 6, symbol: "C", name: "탄소" , count: 1 },
            { number: 7, symbol: "N", name: "질소" , count: 1 },
            { number: 8, symbol: "O", name: "산소" , count: 1 },
            { number: 9, symbol: "F", name: "플루오린" , count: 1 },
            { number: 10, symbol: "Ne", name: "네온" , count: 1 },
            { number: 11, symbol: "Na", name: "나트륨" , count: 1 },
            { number: 12, symbol: "Mg", name: "마그네슘" , count: 1 },
            { number: 13, symbol: "Al", name: "알루미늄" , count: 1 },

            { number: 16, symbol: "S", name: "황" , count: 1 },
            { number: 17, symbol: "Cl", name: "염소" , count: 1 },
            { number: 18, symbol: "Ar", name: "아르곤" , count: 1 },
            { number: 19, symbol: "K", name: "칼륨" , count: 1 },
            { number: 20, symbol: "Ca", name: "칼슘" , count: 1 }
            // 필요에 따라 20번, 30번 원소까지 계속 추가하실 수 있습니다!
        ];

        // 싱글모드 변수
        let currentGameMode = 'symbol';
        let currentScore = 0;
        let timeLeft = 30;
        let timerInterval = null;
        let currentElement = null;

        // 멀티 모드 전용 변수들
        let currentRoomCode = null;
        let isHost = false;
        let multiUnsubscribe = null;
        let multiTimerInterval = null;
        let multiTimeLeft = 30;
        let timeLimit = 30;
        let multiCurrentScore = 0;
        let multiQuestionIndex = 0;
        let multiQuestionsList = [];
        let multiGameMode = 'symbol';
        
        function softmax(arr, temperature = 1.0) {
            // 0으로 나누는 것을 방지하기 위해 아주 작은 값 보정
            const temp = Math.max(temperature, 0.0001);
            
            // 1. 각 값에 temperature를 나눔 (오버플로우 방지용 max 값은 나누기 후에 적용하거나 전에 적용)
            const scaledArr = arr.map(x => x / temp);
            const max = Math.max(...scaledArr);
            
            // 2. 지수 함수 적용
            const exps = scaledArr.map(x => Math.exp(x - max));
            const sum = exps.reduce((a, b) => a + b, 0);
            
            // 3. 확률 배열 반환
            return exps.map(x => x / sum);
        }

        // 인증 상태 감지
        let userRole = 'student'; // 전역 변수로 역할 저장

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const rawUsername = user.email.replace(DOMAIN, '');
                
                // 🔥 Firestore에서 유저 권한 정보 가져오기
                const userDocRef = doc(db, "users", user.uid);
                const userDocSnap = await getDoc(userDocRef);
                
                if (userDocSnap.exists()) {
                    userRole = userDocSnap.data().role; // 'teacher' 또는 'student'
                } else {
                    // 만약 기존 가입 유저라 데이터가 없다면 관리자 목록 기준으로 재판별 후 저장
                    userRole = ADMIN_EMAILS.includes(user.email) ? 'teacher' : 'student';
                    await setDoc(userDocRef, { email: user.email, role: userRole, createdAt: new Date() }, { merge: true });
                }

                document.getElementById('user-display').innerText = `${rawUsername}님 환영합니다! (${userRole === 'teacher' ? '교사' : '학생'})`;
                
                // 🔥 학생 계정일 경우 멀티 모드 화면의 '방 만들기' 버튼 숨기기
                const createRoomBtn = document.querySelector('button[onclick="createRoom()"]');
                if (createRoomBtn) {
                    createRoomBtn.style.display = (userRole === 'teacher') ? 'block' : 'none';
                }

                switchScreen('dashboard-screen');
            } else {
                currentUser = null;
                userRole = 'student';
                switchScreen('auth-screen');
            }
        });

        // 화면 전환 헬퍼 함수
        window.switchScreen = function(screenId) {
            // 배열에 'multi-game-screen', 'multi-result-screen' 추가
            ['auth-screen', 'dashboard-screen', 'single-menu-screen', 'single-game-screen', 'multi-screen', 'multi-game-screen', 'multi-result-screen', 'ranking-screen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        window.backToDashboard = async () => {
            clearInterval(timerInterval);
            clearInterval(multiTimerInterval);

            // 🔥 방에 참여 중이었던 경우 처리
            if (currentRoomCode) {
                const roomRef = doc(db, "rooms", currentRoomCode);
                try {
                    if (isHost) {
                        // 방장이 나가면 방 자체를 삭제하여 빈 방에 남는 문제 원천 차단
                        await deleteDoc(roomRef);
                    } else {
                        // 일반 참가자가 나가면 방의 participants 목록에서 내 정보 제거
                        const roomSnap = await getDoc(roomRef);
                        if (roomSnap.exists()) {
                            const data = roomSnap.data();
                            // 현재 로그인한 유저의 email이나 고유값과 다른 참가자들만 남김
                            // 일반 참가자가 나갈 때 본인을 제외하는 로직 예시
                            const updatedParticipants = (data.participants || []).filter(p => p.uid !== currentUser.uid);
                            await updateDoc(roomRef, { participants: updatedParticipants });
                        }
                    }
                } catch (e) {
                    console.error("방 나가기 처리 중 오류:", e);
                }
            }

            if (multiUnsubscribe) multiUnsubscribe(); // 실시간 리스너 해제
            currentScore = 0;
            currentRoomCode = null;
            isHost = false;

            const singleInput = document.getElementById('quiz-answer-input');
            const multiInput = document.getElementById('multi-quiz-answer-input');
            if (singleInput) singleInput.value = '';
            if (multiInput) multiInput.value = '';
            
            switchScreen('dashboard-screen');

        function nextQuestion() {
            // 1. 각 원소의 count에 마이너스를 붙여서 Softmax 입력값 생성 (많이 나올수록 선택 확률 낮아짐)
            // 섭씨/화씨나 온도 조절처럼 조절 계수(temperature)를 곱해줄 수도 있습니다 (예: / 1.0)
            const logits = elementData.map(el => -el.count);
            const probabilities = softmax(logits, 0.8);

            // 2. 확률 분포에 따라 랜덤하게 하나의 원소 선택
            let randomVal = Math.random();
            let accumulatedProb = 0;
            let selectedIndex = 0;

            for (let i = 0; i < probabilities.length; i++) {
                accumulatedProb += probabilities[i];
                if (randomVal <= accumulatedProb) {
                    selectedIndex = i;
                    break;
                }
            }

            currentElement = elementData[selectedIndex];
            let displayMode = currentGameMode;
            
            if (currentGameMode === 'mixed') {
                displayMode = Math.random() < 0.5 ? 'symbol' : 'element';
            }

            const questionEl = document.getElementById('quiz-question');

                questionEl.innerText = currentElement.symbol;
            } else {

            }

            document.getElementById('quiz-answer-input').value = '';
            document.getElementById('quiz-answer-input').focus();
        }

                if (liveBoard) {

                    liveBoard.innerHTML = '';

                    multiGameMode = data.mode;

        // 방 코드를 기준으로 동일한 문제 시퀀스를 만드는 해시 함수
        function generateDeterministicQuestions(seedStr) {
            let hash = 0;
            for (let i = 0; i < seedStr.length; i++) {
                hash = seedStr.charCodeAt(i) + ((hash << 5) - hash);
            }
            let seed = Math.abs(hash);
            function random() {
                let t = seed += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
            let shuffled = [...elementData];
            for (let i = shuffled.length - 1; i > 0; i--) {
                let j = Math.floor(random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        async function finishMultiGame() {

                            await setDoc(scoreRef, {

                    }

                    // 3. ⭐️ 핵심: 방을 삭제하는 대신 status를 "finished"로 변경하고 최신 참가자 명단 저장!
                    // 이렇게 하면 onSnapshot을 통해 모든 참가자에게 동시에 finished 상태와 최종 participants 데이터가 전달됩니다.
                    await updateDoc(roomRef, {
                        status: "finished",
                        participants: participants
                    });
                }
            } catch (e) {
                console.error("멀티게임 종료 처리 오류:", e);
            }
        }



        function showMultiResult(participants) {
            switchScreen('multi-result-screen');
            const sorted = [...participants].sort((a, b) => b.score - a.score);
            const listEl = document.getElementById('final-ranking-list');
            listEl.innerHTML = '<h3 class="font-bold text-slate-700 mb-2">🏆 최종 순위 발표</h3>';
            sorted.forEach((p, idx) => {
                listEl.innerHTML += `<div class="flex justify-between py-2 border-b"><span class="font-bold">${idx+1}위. ${p.name}</span><span class="text-indigo-600 font-semibold">${p.score}점</span></div>`;
            });
        }


        // 대시보드에서 랭킹 보기를 누를 때 기본으로 'symbol' 모드 랭킹 오픈
        window.showRanking = async () => {
            switchScreen('ranking-screen');
            await loadRanking('symbol');
        };

        // 특정 모드의 랭킹을 불러와 화면에 렌더링하는 함수
        window.loadRanking = async (mode) => {
            // 탭 디자인 활성화/비활성화 처리
            ['symbol', 'element', 'mixed'].forEach(m => {
                const tab = document.getElementById(`tab-${m}`);
                if (m === mode) {
                    tab.className = "flex-1 py-2 px-3 bg-indigo-600 text-white rounded-lg text-sm font-bold";
                } else {
                    tab.className = "flex-1 py-2 px-3 bg-slate-200 text-slate-700 rounded-lg text-sm font-bold";
                }
            });

            const rankingListEl = document.getElementById('ranking-list');
            rankingListEl.innerHTML = '<p class="text-center text-slate-400">불러오는 중...</p>';

            try {
                // 🔥 모드별 필터링 쿼리 (where("mode", "==", mode) 추가)
                const q = query(
                    collection(db, "scores"), 
                    where("mode", "==", mode), 
                    orderBy("score", "desc"), 
                    limit(10)
                );
                const querySnapshot = await getDocs(q);

                rankingListEl.innerHTML = '';
                let rank = 1;
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const rawName = data.email ? data.email.name || data.email.replace(DOMAIN, '') : '알수없음';
                    rankingListEl.innerHTML += `
                        <div class="flex justify-between py-2 px-3">
                            <span class="font-bold">${rank}위. ${rawName}</span>
                            <span class="text-indigo-600 font-semibold">${data.score}점</span>
                        </div>
                    `;
                    rank++;
                });

                if (rank === 1) {
                    rankingListEl.innerHTML = '<p class="text-center text-slate-400">이 모드에 등록된 랭킹이 없습니다.</p>';
                }
            } catch (e) {
                console.error("랭킹 불러오기 실패:", e);
                rankingListEl.innerHTML = '<p class="text-center text-red-400">랭킹을 불러오는 데 실패했습니다. (Firestore 인덱스 설정이 필요할 수 있습니다)</p>';
            }
        };

        // 🔥 [추가] Power Mode 이펙트 관련 함수들
        function triggerPowerMode() {
            const mainContainer = document.querySelector('.max-w-4xl') || document.querySelector('.max-w-2xl');; // 전체 앱 박스 흔들기
            const isSingle = document.getElementById('single-game-screen').classList.contains('hidden');
            const cardBox = isSingle ? document.getElementById('multi-card-box') : document.getElementById('quiz-card-box'); // 파티클 기준점

            // 1. 화면 전체 흔들기
            if (mainContainer) {
                mainContainer.classList.add('pow-mode-shake');
                setTimeout(() => { mainContainer.classList.remove('pow-mode-shake'); }, 400);
            }

            // 2. 타격감 사운드 재생
            playPowerSound();

            // 3. 파티클 폭발 생성
            const colors = ['#6366f1', '#a855f7', '#ec4899', '#f59e0b', '#10b981'];
            for (let i = 0; i < 25; i++) {
                createParticle(cardBox, colors[i % colors.length]);
            }
        }

        function playPowerSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(180, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.12);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.12);
        }

        function createParticle(targetElement, color) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // 🔥 만약 targetElement가 숨겨져 있거나 크기가 0이면 기본 중앙값 대체
            const rect = targetElement.getBoundingClientRect();
            
            // targetElement 안에 직접 파티클을 붙이도록 변경 (position: relative가 부모에 있어야 함)
            // 부모 기준 중앙에서 시작하도록 설정
            const startX = rect.width / 2;
            const startY = rect.height / 2;

            particle.style.backgroundColor = color;
            const size = Math.random() * 8 + 6;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            // 카드 박스 내부의 중앙을 기준 좌표로 설정
            particle.style.left = `${startX}px`;
            particle.style.top = `${startY}px`;

            // body가 아니라 targetElement에 직접 부착 (단, targetElement에 position: relative 필수)
            if (getComputedStyle(targetElement).position === 'static') {
                targetElement.style.position = 'relative';
            }
            targetElement.appendChild(particle);

            const destinationX = (Math.random() - 0.5) * 250;
            const destinationY = (Math.random() - 0.5) * 250;

            particle.style.setProperty('--x', `${destinationX}px`);
            particle.style.setProperty('--y', `${destinationY}px`);

            particle.style.animation = `pop ${Math.random() * 0.4 + 0.3}s ease-out forwards`;

            setTimeout(() => {
                particle.remove();
            }, 700);
        }

        // 커스텀 모달 열기 함수 (alert 대체용)
        window.showModal = function(title, message) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        window.closeCustomModal = function() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        // ⌨️ 키를 누를 때마다 가벼운 타자기 소리 재생 (Web Audio API 활용)
        // ⌨️ 타이핑할 때마다 실행되는 미니 Power Mode (마이크로 흔들림 + 미니 파티클 + 총소리 느낌의 사운드)
        function triggerMiniPowerMode() {
            // 1. 입력창 또는 카드 박스에 아주 가벼운 흔들림 주기
            const cardBox = (currentRoomCode === null) ? document.getElementById('quiz-card-box') : document.getElementById('multi-card-box');
            // console.log("triggerMiniPowerMode, cardBox.id = " + cardBox.id);
            if (cardBox) {
                cardBox.classList.add('micro-shake');
                setTimeout(() => { cardBox.classList.remove('micro-shake'); }, 150);
            }

            // 2. 가벼운 타격감/총소리 느낌의 짧은 효과음 (선택사항)
            playTinyGunSound();

            // 3. 톡톡 튀는 미니 파티클 2~3개 생성
            if (cardBox) {
                const colors = ['#6366f1', '#a855f7', '#ec4899', '#38bdf8'];
                for (let i = 0; i < 3; i++) {
                    createParticle(cardBox, colors[Math.floor(Math.random() * colors.length)]);
                }
            }
        }
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // 총소리/탁 치는 느낌의 짧고 굵은 사운드
        function playTinyGunSound() {
            try {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'triangle'; // 조금 더 묵직한 느낌
                oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.05);

                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }
        window.forceFinishGame = async function() {
            if (!confirm("게임을 강제 종료하시겠습니까?")) return;
            const roomRef = doc(db, "rooms", currentRoomCode);
            await updateDoc(roomRef, { status: "finished" });
        }
        // ❌ 틀렸을 때 나는 낮고 짧은 비프(오답) 소리
        function playWrongSound() {
            try {
                // 기존 audioCtx를 재사용하거나 새로 생성
                const ctx = window.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();

                // 톱니바퀴 모양(sawtooth)이나 네모 모양(square)이 둔탁하고 낮은 오답 느낌을 주기 좋습니다
                oscillator.type = 'sawtooth';
                
                // 낮은 주파수(120Hz)에서 더 낮게(60Hz) 떨어지도록 설정
                oscillator.frequency.setValueAtTime(120, ctx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.2);

                // 볼륨 설정 및 서서히 줄어들게 처리
                gainNode.gain.setValueAtTime(0.2, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);

                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                
                oscillator.start();
                oscillator.stop(ctx.currentTime + 0.2);
            } catch (e) {
                console.error(e);
            }
        }
    </script>
    <!-- 커스텀 알림 모달 -->
    <div id="custom-modal" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full mx-4 text-center space-y-4">
            <h3 id="modal-title" class="text-lg font-bold text-slate-800">알림</h3>
            <p id="modal-message" class="text-sm text-slate-600">메시지 내용</p>
            <button onclick="closeCustomModal()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold hover:bg-indigo-700 transition">확인</button>
        </div>
    </div>
</body>
