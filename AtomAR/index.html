<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>중학생을 위한 원자 AR 관찰 앱</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        #ui { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 10px; border-radius: 5px; font-family: sans-serif; }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">
    <div id="ui">
        <input type="checkbox" id="realSizeToggle"> <label for="realSizeToggle"><b>Real Size</b></label>
    </div>

    <a-scene embedded arjs="sourceType: webcam; patternRatio: 0.5;">
        <!-- 본인의 patt 파일 경로로 수정하세요 -->
        <a-marker preset="hiro" size="0.09">
            <a-entity id="atom" position="0 0.5 0" scale="0.6 0.6 0.6" atom-vibration>
                <!-- 하얀 껍질 (원자 전체의 크기를 나타냄, 반지름 1) -->
                <a-sphere id="shell" radius="1" color="white" opacity="0.8" transparent="true"></a-sphere>
                <!-- 원자핵 및 전자 컨테이너 -->
                <a-entity id="nucleus-container"></a-entity>
                <a-entity id="electrons-container"></a-entity>
            </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const protonsCount = Math.floor(Math.random() * 4) + 1;
        const atom = document.querySelector('#atom');
        const shell = document.querySelector('#shell');
        const nucleusContainer = document.querySelector('#nucleus-container');
        const electronsContainer = document.querySelector('#electrons-container');
        const toggle = document.querySelector('#realSizeToggle');
        const fromDistance = 3.5;
        const toDistance = 2.3;
        let alpha = 1;

        function createAtom() {
            // 1. 원자핵 생성 (양성자 + 중성자)
            // 양성자가 1개면 중성자 0개, 2개 이상이면 양성자 수 = 중성자 수
            const neutronCount = (protonsCount === 1) ? 0 : protonsCount;
            const totalNucleons = protonsCount + neutronCount;
            const nucleonRadius = 0.04; // 핵자 하나의 반지름
            // 핵자들이 서로 겹치지 않고 딱 붙어있도록 하기 위한 최소 거리 (지름 + 알파)
            const spacing = nucleonRadius * 1.1;

            // 원자핵 뭉치 표현 (여러 개의 구가 서로 붙어있는 형태)
            for (let i = 0; i < totalNucleons; i++) {
                const nucleon = document.createElement('a-sphere');
                // 양성자는 빨간색, 중성자는 회색으로 표현
                nucleon.setAttribute('color', (i % 2 == 0) ? '#ff4d4d' : '#cccccc');
                nucleon.setAttribute('radius', nucleonRadius);
                
                let x = 0, y = 0, z = 0;

                // 개수에 따라 겹치지 않게 좌표 분산 배치
                if (totalNucleons === 1) {
                    x = 0; y = 0; z = 0;
                } else if (totalNucleons === 2) {
                    // 2개일 때는 서로 딱 붙게
                    x = (i === 0 ? -spacing : spacing) * 0.5;
                } else {
                    // 3개 이상일 때는 0,0,0 중심을 향해 촘촘하게 배치 (지그재그 구체 형태)
                    const angle = (i / totalNucleons) * Math.PI * 2;
                    // 간격을 아주 좁게 주어 서로 겹치듯 밀착시킴
                    const r = (i % 2 === 0) ? spacing * 0.6 : spacing * 1.0;
                    x = Math.cos(angle) * r;
                    z = Math.sin(angle) * r;
                    // 높이(Y)도 중앙으로 모이도록 압축
                    y = ((i % 3) - 1) * (nucleonRadius * 0.4);
                }

                nucleon.setAttribute('position', `${x} ${y} ${z}`);
                
                // 기본 모드용 스케일 태그 부여
                nucleon.classList.add('nucleon-scale');
                nucleusContainer.appendChild(nucleon);
            }

            // 2. 전자 생성 (양성자 수와 동일)
            for (let i = 0; i < protonsCount; i++) {
                const orbit = document.createElement('a-entity');
                // 각기 다른 방향과 속도로 회전하는 궤도 설정
                orbit.setAttribute('animation', `property: rotation; to: ${360 * (i+1)} ${360 * (i+2)} 0; dur: ${2000 + i*600}; loop: true; easing: linear`);
                
                const electron = document.createElement('a-sphere');
                electron.setAttribute('color', '#3399ff');
                electron.setAttribute('radius', '0.015'); // 기본 모드에서의 크기
                electron.setAttribute('position', `${0.6 + i*0.1} 0 0`); // 궤도 반지름
                electron.classList.add('electron-scale');
                
                orbit.appendChild(electron);
                electronsContainer.appendChild(orbit);
            }
        }

        // 거리 기반 투명도 및 Real Size 토글 처리 컴포넌트
        AFRAME.registerComponent('camera-distance-handler', {
            tick: function() {
                const camera = document.querySelector('a-camera') || document.querySelector('[camera]');

                // Three.js의 Vector3 객체를 이용해 월드 좌표를 담을 준비
                const atomPosition = new THREE.Vector3();
                const cameraPosition = new THREE.Vector3();

                // 마커(this.el)와 카메라의 실제 3차원 월드 좌표 가져오기
                this.el.object3D.getWorldPosition(atomPosition);
                camera.object3D.getWorldPosition(cameraPosition);

                // 거리 계산
                const distance = atomPosition.distanceTo(cameraPosition);
                
                alpha = (distance - toDistance)/(fromDistance - toDistance);
                alpha = Math.min(Math.max(alpha, 0.0), 1.0);
                console.log("distance: " + distance)
                console.log("alpha: " + alpha)
                
                
                // 카메라가 가까이 오면(2미터 이내) 껍질이 투명해짐
                shell.setAttribute('opacity', alpha);
                
                // Real Size 토글 체크 여부 확인
                const isReal = toggle.checked;
                
                // Real Size 체크 시: 원자핵과 전자의 실제 크기 비율 반영 (극단적으로 작게 설정, 예: 0.0005배)
                // 가시성을 위해 완전히 0으로 만들면 안 보이므로 학생들이 인지할 수 있는 최소한의 극단적 비율(0.001배) 적용
                const n_scaleValue = isReal ? 1/400 : 1;
                const e_scaleValue = isReal ? 1/4000000 : 1;
                
                document.querySelectorAll('.electron-scale').forEach(el => {
                    el.setAttribute('scale', `${e_scaleValue} ${e_scaleValue} ${e_scaleValue}`);
                });
                document.querySelectorAll('.nucleon-scale').forEach(el => {
                    el.setAttribute('scale', `${n_scaleValue} ${n_scaleValue} ${n_scaleValue}`);
                });
            }
        });

        // --- 원자 미세 진동(열운동) 효과 컴포넌트 ---
        AFRAME.registerComponent('atom-vibration', {
            init: function() {
                // 원자의 원래 중심 위치 저장
                this.originalPosition = { x: 0, y: 0.5, z: 0 };
                // 진동 속도와 범위를 다르게 주기 위한 고유값 생성
                this.seedX = Math.random() * 100;
                this.seedZ = Math.random() * 100;
            },
            tick: function(time) {
                // 학생들이 관찰하기 좋게 아주 미세하고 부드러운 진동 폭 설정 (단위: 미터)
                const vibrationIntensity = 0.015; // 약 1.5cm 폭으로 흔들림
                
                // 시간을 바탕으로 자연스러운 삼각함수 파동 생성 (속도 조절 가능)
                const speed = 0.003;

                // object3D를 직접 조작하는 것이 setAttribute보다 모바일 환경에서 훨씬 부드럽습니다 (성능 최적화)
                const obj3D = this.el.object3D;
                const offsetX = Math.sin(time * speed + this.seedX) * vibrationIntensity;
                const offsetZ = Math.cos(time * speed * 0.8 + this.seedZ) * vibrationIntensity;
                
                // 원래 위치를 중심으로 X, Z 축 방향으로 무작위성 가미하여 이동
                obj3D.position.x = this.originalPosition.x + offsetX;
                obj3D.position.z = this.originalPosition.z + offsetZ;
            }
        });

        atom.setAttribute('camera-distance-handler', '');
        createAtom();
    </script>
</body>
</html>
