<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>원자 만들기 (Atom Builder)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Disable text selection and touch gestures for iPad/Touch responsiveness */
        body, html {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        canvas {
            display: block;
        }
        .particle-btn {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .particle-btn:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body class="bg-slate-900 text-white w-screen h-screen flex flex-col md:flex-row overflow-hidden select-none">

    <!-- Top-left Reset Button & Top Center Element Display Container -->
    <div class="absolute top-4 left-4 z-20 flex items-center gap-3">
        <button id="reset-btn" class="flex items-center gap-2 bg-slate-800/80 hover:bg-slate-700/90 text-slate-200 border border-slate-600 px-4 py-2.5 rounded-xl font-medium shadow-lg backdrop-blur-md transition-all active:scale-95">
            <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            <span>초기화</span>
        </button>
    </div>

    <!-- Element Symbol & Stability Display -->
    <div id="element-display" class="absolute top-4 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center pointer-events-none transition-all duration-300 opacity-0 scale-95">
        <div class="bg-slate-800/85 backdrop-blur-md border border-slate-700/80 px-6 py-3 rounded-2xl shadow-2xl flex items-baseline gap-1">
            <span id="symbol-main" class="text-4xl font-black tracking-tight text-white">H</span>
            <span id="symbol-charge" class="text-2xl font-bold text-amber-400">⁺</span>
        </div>
        <div id="stability-indicator" class="mt-2 text-xs font-semibold px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 flex items-center gap-1.5 opacity-0 transition-opacity duration-300">
            <div class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></div>
            <span id="stability-text">핵 안정화 판정 중...</span>
        </div>
    </div>

    <!-- Interactive Canvas Workspace -->
    <main class="flex-1 relative w-full h-full">
        <canvas id="atom-canvas" class="w-full h-full bg-slate-950 cursor-crosshair"></canvas>
    </main>

    <!-- Particle Palette Sidebar (Right side for iPad portrait/landscape) -->
    <aside class="w-full h-28 md:h-full md:w-36 bg-slate-800/90 backdrop-blur-md border-t md:border-t-0 md:border-l border-slate-700/80 flex md:flex-col items-center justify-evenly p-3 z-20 shadow-2xl shrink-0">
        <!-- Proton Drag Source -->
        <div class="flex flex-col items-center gap-1.5">
            <div id="proton-btn" data-type="proton" class="particle-btn w-16 h-16 md:w-20 md:h-20 rounded-full bg-gradient-to-br from-red-500 to-rose-700 border-2 border-red-300 shadow-lg flex items-center justify-center cursor-grab active:cursor-grabbing text-white font-black text-2xl md:text-3xl touch-none">
                +
            </div>
            <span class="text-xs font-semibold text-rose-300 tracking-wider">양성자</span>
        </div>

        <!-- Neutron Drag Source -->
        <div class="flex flex-col items-center gap-1.5">
            <div id="neutron-btn" data-type="neutron" class="particle-btn w-16 h-16 md:w-20 md:h-20 rounded-full bg-gradient-to-br from-slate-100 to-slate-300 border-2 border-slate-400 shadow-lg flex items-center justify-center cursor-grab active:cursor-grabbing text-slate-800 font-bold touch-none">
            </div>
            <span class="text-xs font-semibold text-slate-300 tracking-wider">중성자</span>
        </div>

        <!-- Electron Drag Source -->
        <div class="flex flex-col items-center gap-1.5">
            <div id="electron-btn" data-type="electron" class="particle-btn w-12 h-12 md:w-16 md:h-16 rounded-full bg-gradient-to-br from-blue-400 to-indigo-600 border-2 border-blue-200 shadow-lg flex items-center justify-center cursor-grab active:cursor-grabbing text-white font-black text-xl md:text-2xl touch-none">
                −
            </div>
            <span class="text-xs font-semibold text-blue-300 tracking-wider">전자</span>
        </div>
    </aside>
    <script src="app.js"></script>
</body>
</html>
